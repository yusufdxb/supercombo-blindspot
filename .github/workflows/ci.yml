name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install unit-test dependencies
        run: pip install -r requirements-ci.txt

      - name: Run unit tests
        # The CARLA integration suite (tests/test_carla_connection.py) skips
        # itself when no simulator is reachable, which is always true in CI.
        run: python -m pytest -q
