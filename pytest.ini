[pytest]
# Block pytest from auto-loading ROS2 launch plugins (humble bleeds in via
# PYTHONPATH when /opt/ros/humble/setup.bash has been sourced). The third one,
# entry-point name `launch_ros`, raises PluginValidationError on collection if
# left enabled. We do not need any of them.
addopts = -p no:launch_testing -p no:launch_pytest -p no:launch_ros --import-mode=importlib -m "not slow"
testpaths = tests
markers =
    slow: tests requiring full 512-D Mahalanobis (np.linalg.inv is slow in this venv) or full bootstrap; run with -m slow
